name: Validate Sewer Suction Documentation

on:
  push:
    paths:
      - "README.md"
      - "docs/sewer-suction/**"
      - "scripts/check_sewer_suction.py"
      - ".github/workflows/check-sewer-suction.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/sewer-suction/**"
      - "scripts/check_sewer_suction.py"
      - ".github/workflows/check-sewer-suction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check internal links and WebP coverage
        run: python scripts/check_sewer_suction.py
